<form hx-post="{% url 'blog:comment_create' post.slug %}"
      hx-target="#comments-list"
      hx-swap="afterbegin"
      hx-on::after-request="if(event.detail.successful) this.reset()"
      class="bg-gray-50 dark:bg-panel border border-gray-200 dark:border-edge p-4">

    {% csrf_token %}
    <input type="hidden" name="parent" value="">

    <textarea name="text"
              rows="3"
              placeholder="Написать комментарий..."
              required
              class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-edge text-sm text-gray-900 dark:text-white placeholder-gray-500 focus:outline-none focus:border-black dark:focus:border-volt resize-none"></textarea>

    <div class="mt-3 flex items-center justify-between">
        <a href="{% url 'blog:profile' user.pk %}" class="text-xs font-mono uppercase tracking-widest text-gray-500 dark:text-gray-400">
            <i class="fas fa-user mr-1"></i> {{ request.user.username }}
        </a>
        <button type="submit"
                class="px-4 py-2 bg-volt text-black text-sm font-bold hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black">
            <i class="fas fa-paper-plane mr-1"></i> Отправить
        </button>
    </div>
</form>
