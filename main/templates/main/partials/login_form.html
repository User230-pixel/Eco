<form hx-post="{% url 'main:login_submit' %}"
      hx-target="this"
      hx-swap="outerHTML"
      hx-select="form"
      method="POST">
    {% csrf_token %}

    {% if login_form.non_field_errors %}
    <div class="mb-4 px-4 py-3 border border-red-500/40 bg-red-500/10 text-red-600 dark:text-red-400 text-sm font-medium flex items-center gap-2">
        <i class="fas fa-exclamation-circle"></i>
        {{ login_form.non_field_errors.0 }}
    </div>
    {% endif %}

    {% for field in login_form %}
    <div class="mb-5">
        <label for="{{ field.id_for_label }}" class="block text-xs font-mono uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-2">
            {{ field.label }}
        </label>
        {{ field }}
        {% if field.errors %}
        <span class="mt-2 block text-xs text-red-600 dark:text-red-400 font-medium">
            <i class="fas fa-exclamation-circle"></i> {{ field.errors.0 }}
        </span>
        {% endif %}
    </div>
    {% endfor %}

    <button type="submit" class="w-full flex items-center justify-center gap-2 px-6 py-3 bg-volt text-black text-sm font-bold hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black">
        <i class="fas fa-sign-in-alt"></i> Войти
    </button>
</form>
