<!-- ===================== ВЫВОД ОШИБОК ===================== -->
{% if error_message %}
<div class="verify-error mb-4 px-4 py-3 border border-red-500/40 bg-red-500/10 text-red-600 dark:text-red-400 text-sm font-medium flex items-center gap-2" id="form-message">
    <i class="fas fa-exclamation-triangle"></i> {{ error_message }}
</div>
{% endif %}

<!-- ===================== ФОРМА ПОДТВЕРЖДЕНИЯ ===================== -->
<form hx-post="/verify/submit/" hx-target="#verify-form-container"
      hx-select="#verify-form-container"
      id="verify-form">
    {% csrf_token %}

    <div class="mb-5">
        <label for="{{ verification_form.code.id_for_label }}" class="block text-xs font-mono uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-2">
            <i class="fas fa-key"></i> {{ verification_form.code.label }}
        </label>
        <div class="profile-input-wrap">
            {{ verification_form.code }}
        </div>
        {% if verification_form.code.errors %}
        <div class="mt-2 text-xs text-red-600 dark:text-red-400 font-medium flex items-center gap-2">
            <i class="fas fa-exclamation-circle"></i> {{ verification_form.code.errors.0 }}
        </div>
        {% endif %}
    </div>

    <button type="submit" class="w-full flex items-center justify-center gap-2 px-6 py-3 bg-volt text-black text-sm font-bold hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black">
        <i class="fas fa-check"></i> Подтвердить
    </button>
</form>

<!-- ===================== КНОПКА ПОВТОРНОЙ ОТПРАВКИ ===================== -->
<div class="mt-6 pt-6 border-t border-gray-200 dark:border-edge flex flex-col gap-3 text-sm">
    <span class="text-gray-600 dark:text-gray-400">Не пришел код?</span>

    <form method="post" action="{% url 'main:resend_verification' %}">
        {% csrf_token %}
        <button type="submit" id="resend-btn"
                class="w-full flex items-center justify-center gap-2 px-6 py-3 border border-gray-300 dark:border-edge text-sm font-medium text-gray-700 dark:text-gray-300 hover:border-black hover:text-black dark:hover:border-volt dark:hover:text-volt disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fas fa-redo"></i> Отправить снова
        </button>
    </form>

    <div class="text-center text-xs font-mono uppercase tracking-widest text-gray-500 dark:text-gray-400" id="verify-timer">
        Отправить повторно через <span id="timer-seconds" class="text-gray-900 dark:text-white">5</span> минут
    </div>
</div>

<!-- ===================== КОНТЕЙНЕР ДЛЯ СООБЩЕНИЙ ===================== -->
<div id="form-message-container"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const timerSpan = document.getElementById('timer-seconds');
    if (!timerSpan) return;

    let minutesLeft = 5;

    const interval = setInterval(() => {
        minutesLeft--;
        timerSpan.textContent = minutesLeft;

        if (minutesLeft <= 0) {
            clearInterval(interval);
            timerSpan.textContent = '0';
            const resendBtn = document.getElementById('resend-btn');
            if (resendBtn) resendBtn.disabled = false;
        }
    }, 60000);
});
</script>
