<form hx-post="{% url 'main:register_submit' %}"
      hx-target="this"
      hx-swap="outerHTML"
      hx-select="form"
      method="POST">
    {% csrf_token %}

    {% if register_form.non_field_errors %}
    <div class="mb-4 px-4 py-3 border border-red-500/40 bg-red-500/10 text-red-600 dark:text-red-400 text-sm font-medium flex items-center gap-2">
        <i class="fas fa-exclamation-circle"></i>
        {{ register_form.non_field_errors.0 }}
    </div>
    {% endif %}

    {% for field in register_form %}
    <div class="mb-5">
        <label for="{{ field.id_for_label }}" class="block text-xs font-mono uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-2">
            {% if field.name == 'username' %}
                Имя пользователя (логин)
            {% elif field.name == 'email' %}
                Электронная почта
            {% elif field.name == 'phone_number' %}
                Номер телефона
            {% elif field.name == 'password1' %}
                Пароль
            {% elif field.name == 'password2' %}
                Повторите пароль
            {% else %}
                {{ field.label }}
            {% endif %}
        </label>
        {{ field }}
        {% if field.errors %}
        <span class="mt-2 block text-xs text-red-600 dark:text-red-400 font-medium">
            <i class="fas fa-exclamation-circle"></i> {{ field.errors.0 }}
        </span>
        {% endif %}
    </div>
    {% endfor %}

    <button type="submit" class="w-full flex items-center justify-center gap-2 px-6 py-3 mt-4 bg-volt text-black text-sm font-bold hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black">
        <i class="fas fa-user-plus"></i> Зарегистрироваться
    </button>
</form>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const phoneInput = document.querySelector('input[name="phone_number"]');

        if (phoneInput) {
            phoneInput.placeholder = "+7 (999) 999-99-99";

            phoneInput.addEventListener("input", function (e) {
                let input = e.target.value.replace(/\D/g, "");

                if (input.startsWith("7") || input.startsWith("8")) {
                    input = input.substring(1);
                }

                let formatted = "+7 ";
                if (input.length > 0) {
                    formatted += "(" + input.substring(0, 3);
                }
                if (input.length >= 4) {
                    formatted += ") " + input.substring(3, 6);
                }
                if (input.length >= 7) {
                    formatted += "-" + input.substring(6, 8);
                }
                if (input.length >= 9) {
                    formatted += "-" + input.substring(8, 11);
                }

                e.target.value = formatted.trim();
            });
        }
    });
</script>
