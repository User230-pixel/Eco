<div class="mt-3 p-4 bg-white dark:bg-void border border-gray-200 dark:border-edge">

    <label class="block text-xs font-mono uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-2">
        Новый адрес электронной почты
    </label>

    <!-- Инпут формы Django — стилизуем через класс-обёртку -->
    <div class="profile-input-wrap">
        {{ email_form.email }}
    </div>

    {% if email_form.email.errors %}
    <div class="mt-2 text-xs text-red-600 dark:text-red-400 font-medium flex items-center gap-2">
        <i class="fas fa-exclamation-circle"></i> {{ email_form.email.errors.0 }}
    </div>
    {% endif %}

    <div class="mt-4">
        <button type="button"
                class="inline-flex items-center gap-2 px-4 py-2 border border-gray-300 dark:border-edge text-xs font-bold text-gray-700 dark:text-gray-300 hover:border-black hover:text-black dark:hover:border-volt dark:hover:text-volt"
                onclick="document.getElementById('email-form-wrapper').innerHTML=''">
            Отмена
        </button>
    </div>
</div>
